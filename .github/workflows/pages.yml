name: Publish playable Elemental Mage web preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'web/**'
      - 'prototype/**'
      - 'assets/**'
      - 'tools/rebuild_gba_art.py'
      - 'tools/smoke_test.js'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "github-pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify GBA game assets
        run: |
          python -m pip install 'Pillow>=11.0,<13'
          python tools/rebuild_gba_art.py --root .
          python -c 'from tools.rebuild_gba_art import validate; assert validate(".") >= 200'
          node --check prototype/game.js
          node tools/smoke_test.js
          node --check prototype/ui.js
          node tools/test_app_shell.js
      - name: Assemble static web site
        run: |
          mkdir -p _site
          cp -R prototype assets _site/
          cp -R web/. _site/
          test -f _site/index.html
          test -f _site/gallery/index.html
          test -f _site/prototype/index.html
          test -f _site/assets/gba/v1/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: elemental-mage-web-preview
          path: _site
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is configured
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/pages")
          if [ "$code" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is disabled. Configure Settings > Pages > Build and deployment > Source: GitHub Actions."
          fi
      - uses: actions/configure-pages@v5
        if: steps.site.outputs.ready == 'true'
      - uses: actions/download-artifact@v4
        if: steps.site.outputs.ready == 'true'
        with:
          name: elemental-mage-web-preview
          path: _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.ready == 'true'
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: steps.site.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
