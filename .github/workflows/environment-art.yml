name: Materialize environment PNG pack
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/environment-art.yml'
      - 'tools/unpack_environment_art.py'
      - 'tools/validate_environment.py'
      - 'assets/environment/source/environment_art_pack_v2.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Expand environment source pack
        run: python tools/unpack_environment_art.py
      - name: Validate generated assets and metadata
        run: python tools/validate_environment.py
      - name: Commit generated environment sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/environment/v2
          if ! git diff --cached --quiet; then
            git commit -m "art: materialize environment v2 PNGs [skip ci]"
            git push
          fi
