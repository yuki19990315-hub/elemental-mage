name: Validate game prototype and art
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sprite sources and data references
        run: python tools/validate.py
      - name: Check JavaScript syntax and content
        run: |
          node --check prototype/logic.js
          node --check prototype/mechanics_v4.js
          node --check prototype/game.js
          node tools/smoke_test.js
          node tools/test_mechanics_v4.js
          node tools/test_runtime_vm.js
          node --check prototype/ui.js
          node tools/test_app_shell.js
