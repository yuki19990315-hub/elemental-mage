name: Build Elemental Mage Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'tools/stage_android_assets.py'
      - 'tools/verify_android_apk.py'
      - 'prototype/**'
      - 'data/**'
      - 'assets/gba/v1/**'
      - 'assets/ui/v1/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK preinstalled on GitHub runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_HOME" || (echo "::error::Android SDK directory unavailable" && exit 1)
          echo "$SDK_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_HOME/platform-tools" >> "$GITHUB_PATH"
          ls -la "$SDK_HOME/platforms" || true
      - name: Ensure Android 35 platform and build tools
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -f "$SDK_HOME/platforms/android-35/android.jar" ]; then
            sdkmanager --install "platforms;android-35"
          fi
          if [ ! -d "$SDK_HOME/build-tools/35.0.0" ]; then
            sdkmanager --install "build-tools;35.0.0"
          fi
          test -f "$SDK_HOME/platforms/android-35/android.jar"
      - name: Configure Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate game code and bundle offline files
        run: |
          node --check prototype/game.js
          node --check prototype/ui.js
          node tools/smoke_test.js
          node tools/test_app_shell.js
          python tools/stage_android_assets.py
      - name: Compile debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify generated APK contains offline game
        run: python tools/verify_android_apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Copy APK with descriptive name
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/elemental-mage-preview-debug.apk
          sha256sum android/dist/elemental-mage-preview-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ElementalMage-Android-Debug-APK
          path: android/dist/elemental-mage-preview-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK as public GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-preview-v1"
          APK="android/dist/elemental-mage-preview-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Elemental Mage Android APK — Debug Preview" \
              --notes "Android WebView offline prototype (not a finished native game). Contains the latest UI and pixel-art assets. Debug-signed APK, Android 7+; no physical device verification."
          fi
