name: Export SVG game assets to PNG
on:
  push:
    paths:
      - '.github/workflows/export-png.yml'
      - 'assets/**/*.svg'
      - 'tools/export_svg_to_png.py'
      - 'tools/requirements.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG rasterizer
        run: python -m pip install -r tools/requirements.txt
      - name: Rasterize native-resolution sprites
        run: |
          python tools/export_svg_to_png.py
          python - <<'PY'
          from pathlib import Path
          root=Path("assets")
          svgs=[p for p in root.rglob("*.svg") if p.parent.name!="previews"]
          missing=[str(p) for p in svgs if not p.with_suffix(".png").exists()]
          assert not missing, missing
          print(f"PASS: exported {len(svgs)} game PNG sprites")
          PY
      - name: Commit generated PNG artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "art: export transparent PNG sprites from SVG sources [skip ci]"
            git push
          else
            echo "No artwork changes"
          fi
